<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Story Generator</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
    /* Reset and body */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Comic Neue', cursive, sans-serif;
        background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    /* Container card */
    .container {
        max-width: 700px;
        width: 100%;
        background: #fff;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    h1 {
        text-align: center;
        color: #FF6F91;
        font-size: 2.2em;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #555;
        margin-bottom: 25px;
    }

    .input-section {
        margin-bottom: 25px;
    }

    label {
        display: block;
        color: #333;
        font-weight: bold;
        margin-bottom: 8px;
        font-size: 1em;
    }

    input, select {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #FF6F91;
        border-radius: 10px;
        font-size: 1em;
        margin-bottom: 15px;
        transition: border-color 0.3s;
    }

    input:focus, select:focus {
        outline: none;
        border-color: #FF9671;
    }

    button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #FF6F91 0%, #FF9671 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.2em;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
        transform: scale(1.03);
        box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }

    .story-container {
        margin-top: 25px;
        padding: 25px;
        background: #FFF0F5;
        border-radius: 15px;
        border: 2px solid #FF6F91;
    }

    .story-title {
        color: #FF6F91;
        font-size: 1.8em;
        margin-bottom: 15px;
        text-align: center;
    }

    .story-text {
        color: #333;
        line-height: 1.7;
        font-size: 1.1em;
        white-space: pre-wrap;
    }

    .loading {
        text-align: center;
        color: #FF6F91;
        font-size: 1.2em;
        padding: 15px 0;
    }

    .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #FF6F91;
        border-radius: 50%;
        width: 35px;
        height: 35px;
        animation: spin 1s linear infinite;
        margin: 10px auto;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .error {
        background: #FFE5E5;
        border: 2px solid #FF6F91;
        color: #C00;
        padding: 12px;
        border-radius: 10px;
        margin-top: 20px;
        text-align: center;
        font-weight: bold;
    }

    /* Responsive */
    @media (max-width: 500px) {
        .container {
            padding: 20px;
        }

        h1 { font-size: 1.8em; }
        .story-title { font-size: 1.5em; }
    }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

function StoryGenerator() {
    const [topic, setTopic] = useState('');
    const [ageGroup, setAgeGroup] = useState('5-7');
    const [theme, setTheme] = useState('adventure');
    const [story, setStory] = useState('');
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState('');

    const generateStory = async () => {
        if (!topic.trim()) {
            setError('Please enter a topic for the story!');
            return;
        }

        setLoading(true);
        setError('');
        setStory('');

        try {
            const response = await fetch('https://YOUR_FUNCTION_APP_NAME.azurewebsites.net/api/generateStory', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic, ageGroup, theme })
            });

            const data = await response.json();

            if (data.story) setStory(data.story);
            else setError(data.error || 'Failed to generate story. Please try again!');
        } catch (err) {
            setError('Oops! Something went wrong. Please try again later.');
            console.error(err);
        } finally {
            setLoading(false);
        }
    };

    return (
        <div className="container">
            <h1>📚 Kids Story Generator ✨</h1>
            <p className="subtitle">Create magical stories with just a click!</p>

            <div className="input-section">
                <label>Story Topic</label>
                <input type="text" placeholder="e.g., A brave little robot" value={topic} onChange={e => setTopic(e.target.value)} />

                <label>Age Group</label>
                <select value={ageGroup} onChange={e => setAgeGroup(e.target.value)}>
                    <option value="3-5">3-5 years (Preschool)</option>
                    <option value="5-7">5-7 years (Early Elementary)</option>
                    <option value="8-10">8-10 years (Elementary)</option>
                    <option value="11-13">11-13 years (Middle School)</option>
                </select>

                <label>Story Theme</label>
                <select value={theme} onChange={e => setTheme(e.target.value)}>
                    <option value="adventure">Adventure</option>
                    <option value="friendship">Friendship</option>
                    <option value="educational">Educational</option>
                    <option value="magical">Magical</option>
                    <option value="funny">Funny</option>
                    <option value="bedtime">Bedtime</option>
                </select>

                <button onClick={generateStory} disabled={loading}>
                    {loading ? 'Creating Magic...' : '✨ Generate Story ✨'}
                </button>
            </div>

            {error && <div className="error">{error}</div>}

            {loading && (
                <div className="loading">
                    <div className="spinner"></div>
                    Generating story...
                </div>
            )}

            {story && !loading && (
                <div className="story-container">
                    <div className="story-title">Your Story</div>
                    <div className="story-text">{story}</div>
                </div>
            )}
        </div>
    );
}

ReactDOM.render(<StoryGenerator />, document.getElementById('root'));
</script>
</body>
</html>
